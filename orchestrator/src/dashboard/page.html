<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Factory">
<meta name="theme-color" content="#16181d">
<title>Software Factory</title>
<style>
  :root {
    --bg: #f6f6f3; --panel: #ffffff; --ink: #1b1d21; --muted: #6a6f78; --line: #e3e3de;
    --accent: #2f5bd3; --accent-ink: #fff; --good: #1f8a4c; --warn: #b7791f; --bad: #c0392b; --chip: #efefea;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #16181d; --panel: #1f2228; --ink: #e8e9ec; --muted: #9aa0aa; --line: #2e323a;
      --accent: #6d8ff5; --accent-ink: #0d0f13; --good: #4cc387; --warn: #e0a93f; --bad: #ec6a5e; --chip: #2a2e36; }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 -apple-system, system-ui, "Segoe UI", sans-serif;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  header { display: flex; align-items: center; gap: 16px; padding: 14px 20px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg); z-index: 5; }
  header h1 { font-size: 16px; margin: 0; letter-spacing: .01em; white-space: nowrap; }
  @media (max-width: 480px) { header { padding: 12px; gap: 8px; } header h1 { font-size: 15px; } nav button { padding: 6px 8px; } main { padding: 14px; } }
  nav { display: flex; gap: 4px; margin-left: auto; }
  nav button { background: none; border: 0; color: var(--muted); font: inherit; padding: 6px 10px; border-radius: 6px; cursor: pointer; }
  nav button.on { color: var(--ink); background: var(--chip); }
  main { max-width: 1100px; margin: 0 auto; padding: 20px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 28px 0 10px; font-weight: 600; }
  .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .muted { color: var(--muted); } .small { font-size: 13px; } .mono { font-family: var(--mono); font-size: 13px; }
  .spacer { flex: 1; }
  button.btn, select, input, textarea { font: inherit; color: inherit; }
  button.btn { border: 1px solid var(--line); background: var(--panel); padding: 6px 12px; border-radius: 7px; cursor: pointer; }
  button.btn:hover { border-color: var(--muted); }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button.danger { color: var(--bad); }
  button:disabled { opacity: .5; cursor: default; }
  input, select, textarea { background: var(--bg); border: 1px solid var(--line); border-radius: 7px; padding: 7px 10px; width: 100%; }
  textarea { resize: vertical; min-height: 70px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
  .gauge { margin: 6px 0 14px; }
  .gauge .bar { position: relative; height: 10px; background: var(--chip); border-radius: 5px; overflow: visible; }
  .gauge .fill { height: 100%; border-radius: 5px; background: var(--good); }
  .gauge .mark { position: absolute; top: -4px; width: 2px; height: 18px; background: var(--ink); opacity: .55; }
  .gauge .legend { display: flex; justify-content: space-between; font-size: 13px; margin-top: 4px; }
  .chip { display: inline-block; padding: 1px 8px; border-radius: 999px; background: var(--chip); font-size: 12px; white-space: nowrap; }
  .s-done { color: var(--good); } .s-parked, .s-cancelled { color: var(--bad); } .s-blocked { color: var(--warn); }
  .s-building, .s-fixing, .s-in_review, .s-merging { color: var(--accent); }
  table { width: 100%; border-collapse: collapse; }
  td, th { text-align: left; padding: 7px 6px; border-top: 1px solid var(--line); vertical-align: top; font-size: 14px; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; border-top: 0; }
  a { color: var(--accent); text-decoration: none; } a:hover { text-decoration: underline; }
  .attention { border-left: 3px solid var(--warn); }
  .q-text { white-space: pre-wrap; margin: 6px 0 10px; }
  .empty { color: var(--muted); padding: 8px 0; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-size: 14px; z-index: 20; max-width: 90vw; }
  /* plan view */
  .plan { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 16px; align-items: start; }
  @media (max-width: 860px) { .plan { grid-template-columns: 1fr; } }
  .chat { display: flex; flex-direction: column; gap: 10px; max-height: 62vh; overflow-y: auto; padding-right: 4px; }
  .msg { padding: 10px 12px; border-radius: 10px; max-width: 92%; }
  .msg.owner { align-self: flex-end; background: var(--accent); color: var(--accent-ink); white-space: pre-wrap; }
  .msg.planner { align-self: flex-start; background: var(--chip); }
  .msg.system { align-self: center; color: var(--muted); font-size: 13px; text-align: center; }
  .thinking { color: var(--muted); font-size: 13px; animation: pulse 1.4s infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  .md h1, .md h2, .md h3 { font-size: 15px; margin: 14px 0 6px; text-transform: none; letter-spacing: 0; color: var(--ink); }
  .md h1 { font-size: 17px; } .md p { margin: 6px 0; } .md ul { margin: 4px 0; padding-left: 20px; }
  .md code { font-family: var(--mono); font-size: 13px; background: var(--chip); padding: 0 4px; border-radius: 4px; }
  .md pre { background: var(--chip); padding: 10px; border-radius: 6px; overflow-x: auto; }
  .issue { border-top: 1px solid var(--line); padding: 10px 0; }
  .issue summary { cursor: pointer; list-style: none; }
  .issue summary::-webkit-details-marker { display: none; }
  .errors { color: var(--bad); font-size: 13px; }
  .tabs { display: flex; gap: 6px; margin-bottom: 10px; }
</style>
</head>
<body>
<header>
  <h1>Software Factory</h1>
  <span id="paused" class="chip" hidden>Paused</span>
  <nav>
    <button data-view="overview" class="on">Overview</button>
    <button data-view="plans">Plans</button>
    <button data-view="activity">Activity</button>
  </nav>
</header>
<main id="app"><p class="muted">Loading…</p></main>
<script>
"use strict";
let state = null, view = "overview", planId = null, planData = null, planTab = "spec", pollTimer = null;

// ---------- helpers ----------
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const $ = (sel) => document.querySelector(sel);
const fmtTime = (s) => s ? new Date(s * 1000).toLocaleString("en-GB", { timeZone: state?.timezone, weekday: "short", hour: "2-digit", minute: "2-digit" }) : "?";
const ago = (s) => { const d = Math.max(0, Date.now() / 1000 - s); return d < 90 ? "just now" : d < 5400 ? `${Math.round(d / 60)} min ago` : d < 129600 ? `${Math.round(d / 3600)} h ago` : `${Math.round(d / 86400)} d ago`; };
const prUrl = (t) => t.prNumber ? `https://github.com/${encodeURIComponent(projectOwner(t.projectId))}/${encodeURIComponent(t.projectId)}/pull/${t.prNumber}` : null;
const issueUrl = (t) => `https://github.com/${encodeURIComponent(projectOwner(t.projectId))}/${encodeURIComponent(t.projectId)}/issues/${t.issueNumber}`;
const projectOwner = (id) => state?.projects.find((p) => p.id === id)?.owner ?? state?.owner ?? "";
const stateLabel = { queued: "queued", building: "building", fixing: "fixing", in_review: "in review", merging: "merging", deploying: "deploying", done: "merged", blocked: "waiting on you", parked: "parked", cancelled: "cancelled" };

function toast(text) {
  const el = document.createElement("div");
  el.className = "toast"; el.textContent = text; document.body.append(el);
  setTimeout(() => el.remove(), 3500);
}

async function api(method, path, body) {
  const res = await fetch(`/api/${path}`, { method, headers: { "Content-Type": "application/json", "X-Factory": "1" }, body: body ? JSON.stringify(body) : undefined });
  const data = await res.json().catch(() => ({}));
  if (res.status === 401) { location.reload(); throw new Error("Not logged in"); }
  if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
  return data;
}
async function act(fn, ok) { try { await fn(); if (ok) toast(ok); await refresh(); } catch (e) { toast(e.message); } }

/** Small, safe markdown: everything is escaped first, then a few patterns become tags. */
function md(src) {
  const lines = esc(src).split("\n");
  let html = "", inList = false, inCode = false;
  const inline = (t) => t.replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  for (const line of lines) {
    if (line.startsWith("```")) { if (inList) { html += "</ul>"; inList = false; } html += inCode ? "</pre>" : "<pre>"; inCode = !inCode; continue; }
    if (inCode) { html += line + "\n"; continue; }
    const li = /^\s*(?:[-*]|\d+\.)\s+(?:\[( |x)\]\s+)?(.*)$/.exec(line);
    if (li) { if (!inList) { html += "<ul>"; inList = true; } html += `<li>${li[1] === "x" ? "☑ " : li[1] === " " ? "☐ " : ""}${inline(li[2])}</li>`; continue; }
    if (inList) { html += "</ul>"; inList = false; }
    const h = /^(#{1,4})\s+(.*)$/.exec(line);
    if (h) { const n = Math.min(h[1].length, 3); html += `<h${n}>${inline(h[2])}</h${n}>`; continue; }
    if (line.trim()) html += `<p>${inline(line)}</p>`;
  }
  if (inList) html += "</ul>"; if (inCode) html += "</pre>";
  return html;
}

// ---------- overview ----------
function gauge(title, pct, resetsAt, marks) {
  const v = pct ?? 0;
  const color = v >= 90 ? "var(--bad)" : v >= 70 ? "var(--warn)" : "var(--good)";
  const markHtml = marks.filter((m) => m.at != null).map((m) => `<div class="mark" style="left:${Math.min(100, m.at)}%" title="${esc(m.title)}"></div>`).join("");
  return `<div class="gauge"><div class="row small"><strong>${esc(title)}</strong><span class="spacer"></span><span>${pct == null ? "no reading yet" : `${Math.round(v)}%`}</span></div>
    <div class="bar"><div class="fill" style="width:${Math.min(100, v)}%;background:${color}"></div>${markHtml}</div>
    <div class="legend muted"><span>${marks.filter((m) => m.at != null).map((m) => esc(m.title)).join(" · ")}</span><span>resets ${fmtTime(resetsAt)}</span></div></div>`;
}

function taskRow(t) {
  const pr = prUrl(t);
  const actions = t.state === "parked" ? `<button class="btn" onclick="retryTask('${esc(t.id)}')">Retry</button>` : "";
  const cancel = ["queued", "blocked", "parked"].includes(t.state) ? `<button class="btn danger" onclick="cancelTask('${esc(t.id)}')">Cancel</button>` : "";
  return `<tr><td><a href="${issueUrl(t)}" target="_blank" rel="noopener">#${t.issueNumber}</a></td>
    <td>${esc(t.title)}${t.lastFailure && ["parked", "queued", "blocked"].includes(t.state) ? `<div class="muted small">${esc(t.lastFailure.split("\n")[0].slice(0, 200))}</div>` : ""}</td>
    <td><span class="chip s-${t.state}">${stateLabel[t.state] ?? t.state}</span>${t.attempt > 1 ? ` <span class="muted small">try ${t.attempt}</span>` : ""}</td>
    <td>${pr ? `<a href="${pr}" target="_blank" rel="noopener">PR #${t.prNumber}</a>` : ""}</td>
    <td class="row" style="justify-content:flex-end">${actions}${cancel}</td></tr>`;
}

function renderOverview() {
  const s = state, u = s.usage;
  const questions = s.questions.map((q) => `<div class="card attention">
      <div class="row small muted"><span>${q.kind === "migration" ? "Approval needed" : "Question"} #${q.id} · ${esc(q.taskId ?? "")}</span><span class="spacer"></span><span>default ${esc(q.kind === "migration" ? "reject" : q.defaultOption ?? "agent decides")} at ${fmtTime(q.timeoutAt)}</span></div>
      <div class="q-text">${esc(q.question)}</div>
      <div class="row">${q.options.map((o, i) => `<button class="btn ${q.kind === "migration" ? (o === "approve" ? "primary" : "danger") : ""}" onclick="answer(${q.id}, ${i})">${esc(o)}</button>`).join("")}
      ${q.kind === "product" ? `<span class="spacer"></span><button class="btn" onclick="answerFree(${q.id})">Other answer…</button>` : ""}</div></div>`).join("");
  const parked = s.tasks.filter((t) => t.state === "parked");
  const projects = s.projects.map((p) => {
    const tasks = s.tasks.filter((t) => t.projectId === p.id);
    const open = tasks.filter((t) => !["done", "cancelled"].includes(t.state));
    const done = tasks.filter((t) => t.state === "done").slice(0, 5);
    return `<div class="card"><div class="row"><strong>${esc(p.id)}</strong><span class="chip">${esc(p.kind)}</span><span class="muted small">${esc(p.state)} · priority ${p.priority}</span><span class="spacer"></span>
      <a class="small" href="https://github.com/${encodeURIComponent(p.owner)}/${encodeURIComponent(p.id)}" target="_blank" rel="noopener">repo</a>
      <button class="btn" onclick="addTaskForm('${esc(p.id)}')">+ Task</button></div>
      <div id="add-${esc(p.id)}"></div>
      ${open.length || done.length ? `<table>${[...open, ...done].map(taskRow).join("")}</table>` : `<p class="empty">No tasks. Add one, or plan a change in Plans.</p>`}</div>`;
  }).join("");
  return `
    <div class="grid">
      <div class="card"><div class="row"><strong>Usage</strong><span class="spacer"></span><span class="muted small">${u ? `read ${ago(u.takenAt)}` : ""}</span></div>
        ${gauge("5-hour window", u?.fiveHourPct, u?.fiveHourResetsAt, [{ at: s.governor.opusMaxFiveHourPct, title: `Opus stops ${s.governor.opusMaxFiveHourPct}%` }, { at: s.governor.anyMaxFiveHourPct, title: `all stop ${s.governor.anyMaxFiveHourPct}%` }])}
        ${gauge("7-day window", u?.sevenDayPct, u?.sevenDayResetsAt, [{ at: s.burnLine, title: `pace line ${s.burnLine}%` }])}
      </div>
      <div class="card"><strong>Factory</strong>
        <p class="small">${s.pausedUntil ? `Paused until ${fmtTime(s.pausedUntil)}.` : "Running. New tasks start as the budget allows."}</p>
        <div class="row">${s.pausedUntil ? `<button class="btn primary" onclick="resume()">Resume</button>` : `<button class="btn" onclick="pause(1)">Pause 1 h</button><button class="btn" onclick="pause(3)">Pause 3 h</button><button class="btn" onclick="pause(12)">Pause 12 h</button>`}</div>
        <p class="small muted">${s.tasks.filter((t) => ["building", "fixing", "in_review", "merging"].includes(t.state)).length} working · ${s.tasks.filter((t) => t.state === "queued").length} queued · ${s.tasks.filter((t) => t.state === "done").length} merged recently</p>
      </div>
    </div>
    ${s.questions.length || parked.length ? `<h2>Needs you</h2><div class="grid">${questions}${parked.map((t) => `<div class="card attention"><div class="row small muted"><span>Parked · ${esc(t.id)}</span></div><div class="q-text">${esc(t.title)}\n${esc((t.lastFailure ?? "").slice(0, 400))}</div><div class="row"><button class="btn primary" onclick="retryTask('${esc(t.id)}')">Retry</button><button class="btn danger" onclick="cancelTask('${esc(t.id)}')">Cancel</button></div></div>`).join("")}</div>` : ""}
    <h2>Projects</h2>
    ${projects || `<div class="card empty">No projects yet. Start one from Plans.</div>`}`;
}

// ---------- plans ----------
function renderPlans() {
  if (planId !== null) return renderPlan();
  const s = state;
  const rows = s.plans.map((p) => `<tr onclick="openPlan(${p.id})" style="cursor:pointer"><td><strong>${esc(p.title)}</strong><div class="muted small">${p.target === "new" ? "New project" : esc(p.projectId)}</div></td>
    <td><span class="chip">${esc(p.state)}</span></td><td class="muted small">${ago(p.updatedAt)}</td></tr>`).join("");
  return `<div class="grid"><div class="card"><strong>New plan</strong>
      <label>What do you want?</label><input id="np-title" placeholder="e.g. Habit tracker with streaks">
      <label>For</label><select id="np-target" onchange="$('#np-project').hidden = this.value !== 'existing'">
        <option value="new">A new project</option>${s.projects.length ? `<option value="existing">An existing project</option>` : ""}</select>
      <select id="np-project" hidden style="margin-top:8px">${s.projects.map((p) => `<option>${esc(p.id)}</option>`).join("")}</select>
      <label>First message to the planner</label><textarea id="np-msg" placeholder="Describe the idea: who it's for, what it must do, anything you already know you want or don't want."></textarea>
      <label>Planner model</label><select id="np-model"><option value="opus">Opus (best plans, uses more of your limit)</option><option value="sonnet">Sonnet (cheaper)</option></select>
      <div class="row" style="margin-top:12px"><span class="spacer"></span><button class="btn primary" onclick="newPlan()">Start planning</button></div></div>
    <div class="card"><strong>Plans</strong>${rows ? `<table>${rows}</table>` : `<p class="empty">No plans yet.</p>`}</div></div>`;
}

function renderPlan() {
  const d = planData;
  if (!d) return `<p class="muted">Loading plan…</p>`;
  const p = d.plan, f = d.files, thinking = p.state === "thinking" || d.busy && p.state !== "executing", executing = p.state === "executing";
  const msgs = d.messages.map((m) => `<div class="msg ${m.role}">${m.role === "planner" ? `<div class="md">${md(m.text)}</div>` : esc(m.text)}</div>`).join("");
  const issues = f.plan ? f.plan.issues.map((i, n) => `<details class="issue"><summary><div class="row"><span class="muted mono">${n + 1}</span><strong>${esc(i.title)}</strong><span class="spacer"></span>
      <span class="chip">${esc(i.size)}</span><span class="chip">${esc(i.risk)}</span>${i.area ? `<span class="chip">${esc(i.area)}</span>` : ""}</div>
      ${i.dependsOn.length ? `<div class="muted small">after ${i.dependsOn.map(esc).join(", ")}</div>` : ""}</summary><div class="md small">${md(i.body)}</div></details>`).join("") : "";
  const ready = f.plan && f.errors.length === 0 && f.product;
  const done = p.state === "executed";
  const result = p.result && p.result.trackingIssue && p.projectId ? `<p class="small">Plan issue: <a target="_blank" rel="noopener" href="https://github.com/${encodeURIComponent(state.owner)}/${encodeURIComponent(p.projectId)}/issues/${p.result.trackingIssue}">#${p.result.trackingIssue}</a> · ${Object.keys(p.result.issues).length} issues filed</p>` : "";
  return `<div class="row" style="margin-bottom:12px"><button class="btn" onclick="closePlan()">← Plans</button><strong>${esc(p.title)}</strong>
      <span class="chip">${p.target === "new" ? "new project" : esc(p.projectId)}</span><span class="chip">${esc(p.state)}</span><span class="spacer"></span>
      <select style="width:auto" onchange="setModel(this.value)" ${done ? "disabled" : ""}><option value="opus" ${p.model === "opus" ? "selected" : ""}>Opus</option><option value="sonnet" ${p.model === "sonnet" ? "selected" : ""}>Sonnet</option></select>
      ${done ? "" : `<button class="btn danger" onclick="archive()">Archive</button>`}</div>
    <div class="plan">
      <div class="card"><div class="chat" id="chat">${msgs || `<p class="empty">Say what you want to build. The planner drafts a spec and issues, and asks what it needs.</p>`}
        ${thinking ? `<div class="thinking">The planner is thinking… (usually 1-3 minutes)</div>` : ""}${executing ? `<div class="thinking">Executing: creating the repo and issues…</div>` : ""}</div>
        ${done ? "" : `<textarea id="pm-text" placeholder="Reply to the planner…" ${thinking || executing ? "disabled" : ""}></textarea>
        <div class="row" style="margin-top:8px"><span class="muted small">Each message is one planner run (${p.model}).</span><span class="spacer"></span><button class="btn" onclick="sendPlanMessage()" ${thinking || executing ? "disabled" : ""}>Send</button></div>`}</div>
      <div class="card">
        <div class="tabs"><button class="btn ${planTab === "spec" ? "primary" : ""}" onclick="planTab='spec';render()">Spec</button><button class="btn ${planTab === "issues" ? "primary" : ""}" onclick="planTab='issues';render()">Issues${f.plan ? ` (${f.plan.issues.length})` : ""}</button>
          <span class="spacer"></span>${done ? "" : `<button class="btn primary" onclick="execute()" ${ready && !thinking && !executing ? "" : "disabled"}>Execute</button>`}</div>
        ${result}
        ${f.errors.length && !done ? `<div class="errors">${f.errors.map(esc).join("<br>")}</div>` : ""}
        ${planTab === "spec" ? (f.product ? `<div class="md">${md(f.product)}</div>` : `<p class="empty">No spec yet.</p>`) : (issues || `<p class="empty">No issues yet.</p>`)}
        ${f.plan?.project ? `<p class="small muted">New repo: ${esc(state.owner)}/${esc(f.plan.project.name)} (${esc(f.plan.project.kind)}, private)</p>` : ""}
      </div></div>`;
}

// ---------- activity ----------
function renderActivity() {
  const s = state;
  const spend = s.spend.map((r) => `<tr><td>${esc(r.role)}</td><td>${esc(r.model)}</td><td>${r.runs}</td><td>$${Number(r.usd).toFixed(2)}</td></tr>`).join("");
  const runs = s.runs.map((r) => `<tr><td class="muted small">${fmtTime(r.started_at)}</td><td>${esc(r.role)}</td><td>${esc(r.model)}</td><td>${esc(r.task_id ?? "")}</td>
    <td>${r.ok === null ? `<span class="chip s-building">running</span>` : r.ok ? `<span class="chip s-done">ok</span>` : `<span class="chip s-parked">failed</span>`}</td>
    <td class="small">${r.cost_usd != null ? `$${Number(r.cost_usd).toFixed(3)}` : ""}</td><td class="small muted">${r.finished_at ? `${r.finished_at - r.started_at}s` : ""}</td></tr>`).join("");
  const events = s.events.map((e) => { let d = {}; try { d = JSON.parse(e.data); } catch {}
    const text = e.kind === "task.transition" ? `${d.from} → ${d.to}` : e.kind.startsWith("notify.") ? d.text : Object.keys(d).length ? JSON.stringify(d).slice(0, 160) : "";
    return `<tr><td class="muted small">${fmtTime(e.at)}</td><td class="mono">${esc(e.kind)}</td><td>${esc(e.task_id ?? "")}</td><td class="small">${esc(text)}</td></tr>`; }).join("");
  return `<h2>Estimated spend, last 7 days</h2><div class="card">${spend ? `<table><tr><th>Role</th><th>Model</th><th>Runs</th><th>Est. $</th></tr>${spend}</table><p class="muted small">Client-side estimates; on your subscription what counts is the usage gauges.</p>` : `<p class="empty">No runs yet.</p>`}</div>
    <h2>Recent runs</h2><div class="card"><table><tr><th>When</th><th>Role</th><th>Model</th><th>Task</th><th></th><th>Est.</th><th>Time</th></tr>${runs}</table></div>
    <h2>Events</h2><div class="card"><table>${events}</table></div>`;
}

// ---------- actions ----------
window.answer = (id, i) => { const q = state.questions.find((x) => x.id === id); act(() => api("POST", `questions/${id}/answer`, { answer: q.options[i] }), "Answered"); };
window.answerFree = (id) => { const a = prompt("Your answer:"); if (a && a.trim()) act(() => api("POST", `questions/${id}/answer`, { answer: a }), "Answered"); };
window.retryTask = (id) => act(() => api("POST", `tasks/${encodeURIComponent(id)}/retry`), "Back in the queue");
window.cancelTask = (id) => { if (confirm(`Cancel ${id}?`)) act(() => api("POST", `tasks/${encodeURIComponent(id)}/cancel`), "Cancelled"); };
window.pause = (h) => act(() => api("POST", "pause", { hours: h }), `Paused for ${h} h`);
window.resume = () => act(() => api("POST", "resume"), "Resumed");
window.addTaskForm = (pid) => {
  const el = document.getElementById(`add-${pid}`);
  el.innerHTML = el.innerHTML ? "" : `<label>Title</label><input id="t-title-${esc(pid)}"><label>What to do, and how you'll know it works</label>
    <textarea id="t-body-${esc(pid)}" placeholder="Acceptance criteria as a checklist helps the reviewer."></textarea>
    <div class="row" style="margin-top:8px"><select id="t-size-${esc(pid)}" style="width:auto"><option value="s">small</option><option value="m" selected>medium</option><option value="l">large</option></select><span class="spacer"></span>
    <button class="btn primary" onclick="addTask('${esc(pid)}')">Create issue</button></div>`;
};
window.addTask = (pid) => act(async () => {
  const r = await api("POST", `projects/${encodeURIComponent(pid)}/tasks`, { title: $(`#t-title-${pid}`).value, body: $(`#t-body-${pid}`).value, size: $(`#t-size-${pid}`).value });
  document.getElementById(`add-${pid}`).innerHTML = ""; toast(`Created #${r.number}`);
});
window.newPlan = () => act(async () => {
  const target = $("#np-target").value;
  const p = await api("POST", "plans", { title: $("#np-title").value, target, projectId: target === "existing" ? $("#np-project").value : undefined, message: $("#np-msg").value, model: $("#np-model").value });
  await openPlan(p.id);
});
window.openPlan = async (id) => { planId = id; planData = null; render(); await loadPlan(); };
window.closePlan = () => { planId = null; planData = null; render(); };
window.sendPlanMessage = () => { const t = $("#pm-text").value; if (!t.trim()) return; act(async () => { await api("POST", `plans/${planId}/messages`, { text: t }); await loadPlan(); }); };
window.setModel = (m) => act(() => api("POST", `plans/${planId}/model`, { model: m }), `Planner model: ${m}`);
window.archive = () => { if (confirm("Archive this plan? Nothing gets built.")) act(async () => { await api("POST", `plans/${planId}/archive`); closePlan(); }); };
window.execute = () => {
  const f = planData.files;
  const what = planData.plan.target === "new" ? `create the private repo ${state.owner}/${f.plan.project.name} and file ${f.plan.issues.length} issues` : `file ${f.plan.issues.length} issues in ${planData.plan.projectId}`;
  if (confirm(`Execute: ${what}? The factory then builds them without asking.`)) act(async () => { await api("POST", `plans/${planId}/execute`); await loadPlan(); }, "Executing…");
};

// ---------- loop ----------
async function loadPlan() {
  if (planId === null) return;
  const typing = document.activeElement?.id === "pm-text" ? $("#pm-text").value : null;
  try { planData = await api("GET", `plans/${planId}`); } catch (e) { toast(e.message); return; }
  if (view === "plans") { render(); if (typing !== null && $("#pm-text")) { $("#pm-text").value = typing; $("#pm-text").focus(); } const c = $("#chat"); if (c) c.scrollTop = c.scrollHeight; }
}
async function refresh() {
  try { state = await api("GET", "state"); } catch (e) { return; }
  $("#paused").hidden = !state.pausedUntil;
  if (planId !== null) await loadPlan(); else render();
}
function render() {
  if (!state) return;
  const editing = document.activeElement && ["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement.tagName);
  // Don't wipe a half-written form. The open plan is the exception: loadPlan() puts the reply text back.
  if (editing && !(view === "plans" && planId !== null)) return;
  $("#app").innerHTML = view === "overview" ? renderOverview() : view === "plans" ? renderPlans() : renderActivity();
}
document.querySelectorAll("nav button").forEach((b) => b.addEventListener("click", () => {
  view = b.dataset.view; document.querySelectorAll("nav button").forEach((x) => x.classList.toggle("on", x === b)); render();
}));
function schedule() {
  clearTimeout(pollTimer);
  const fast = planData && (planData.plan.state === "thinking" || planData.plan.state === "executing" || planData.busy);
  pollTimer = setTimeout(async () => { await refresh(); schedule(); }, fast ? 2500 : 8000);
}
refresh().then(schedule);
</script>
</body>
</html>
